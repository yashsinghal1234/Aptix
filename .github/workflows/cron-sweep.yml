name: Aptix Scheduled Exam Expiry Sweeper

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions free cron)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sweep-expired-attempts:
    name: Sweep Expired Exam Attempts
    runs-on: ubuntu-latest

    steps:
      - name: Send Ping to /api/cron/sweep
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://aptix.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # 1. Normalize and clean APP_URL (strip whitespace, quotes, trailing slashes)
          CLEAN_URL=$(echo "$APP_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'"'"']//' -e 's/["'"'"']$//' -e 's/\/*$//')
          
          # Default to https:// if protocol scheme is omitted
          if [[ ! "$CLEAN_URL" =~ ^https?:// ]]; then
            CLEAN_URL="https://$CLEAN_URL"
          fi

          # Clean CRON_SECRET (strip whitespace and accidental quotes)
          CLEAN_SECRET=$(echo "$CRON_SECRET" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'"'"']//' -e 's/["'"'"']$//')

          TARGET_ENDPOINT="${CLEAN_URL}/api/cron/sweep"
          echo "Triggering Aptix Exam Sweeper at $TARGET_ENDPOINT..."
          
          # Send GET request with Bearer token authentication
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$TARGET_ENDPOINT" \
            -H "Authorization: Bearer $CLEAN_SECRET" \
            --connect-timeout 15 \
            --max-time 30 2>&1 || echo -e "\nHTTP_STATUS:CURL_FAILED")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ] || ([ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null); then
            echo "✅ Sweeper executed successfully."
          elif [ "$HTTP_STATUS" = "401" ]; then
            echo "⚠️ Warning: Unauthorized (401). Please verify that CRON_SECRET in GitHub Repository Secrets matches your Vercel CRON_SECRET (or JWT_SECRET) environment variable."
            exit 1
          elif [ "$HTTP_STATUS" = "CURL_FAILED" ]; then
            echo "❌ Failed to connect to $TARGET_ENDPOINT. Please verify that your APP_URL secret is a valid, reachable URL."
            exit 1
          else
            echo "❌ Sweeper encountered an issue. HTTP Code: $HTTP_STATUS"
            exit 1
          fi
